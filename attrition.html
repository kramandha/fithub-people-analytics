/* ============================= BASE ============================= */
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:"Fraunces",Georgia,serif; margin:0; text-wrap:balance;}
p{margin:0;}
::selection{background:var(--accent-soft);}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px;}
button{font-family:inherit;}

.app{max-width:1180px; margin:0 auto; padding:0 20px 96px;}

.topbar{
  background:var(--chrome-bg); color:var(--chrome-ink);
  padding:16px 20px; border-bottom:3px solid var(--brand-teal);
}
.topbar-inner{max-width:1180px; margin:0 auto; display:flex; align-items:center; gap:16px; flex-wrap:wrap;}
.wordmark{display:flex; align-items:center; gap:10px;}
.wordmark .mark{
  width:32px; height:32px; border-radius:9px; background:var(--brand-teal);
  display:flex; align-items:center; justify-content:center; flex:none;
  color:var(--mark-ink); font-weight:800; font-size:14px; font-family:"Fraunces",serif;
}
.wordmark .name{font-family:"Fraunces",serif; font-weight:600; font-size:17px;}
.wordmark .sub{font-size:10.5px; color:var(--chrome-ink-muted); text-transform:uppercase; letter-spacing:1.3px; margin-top:1px;}
.topbar-spacer{flex:1;}
.pagepills{display:flex; gap:6px;}
.pagepill{
  appearance:none; border:1px solid var(--chrome-border); background:none; color:var(--chrome-ink-muted);
  padding:7px 13px; border-radius:99px; font-size:12px; font-weight:600; cursor:pointer; white-space:nowrap;
}
.pagepill[aria-current="true"]{background:var(--brand-teal); color:var(--mark-ink); border-color:var(--brand-teal);}
.pagepill:hover:not([aria-current="true"]){color:var(--chrome-ink); border-color:rgba(255,255,255,0.35);}

/* ---------- pages ---------- */
.page{display:none; padding-top:28px;}
.page.active{display:block; animation:fade .25s ease;}
@media (prefers-reduced-motion: reduce){ .page.active{animation:none;} }
@keyframes fade{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}

.page-head{margin-bottom:18px;}
.page-head .eyebrow{font-size:11px; font-weight:700; color:var(--accent); text-transform:uppercase; letter-spacing:1.2px;}
.page-head h1{font-size:26px; font-weight:600; margin-top:4px;}
.page-head .lede{font-size:13.5px; color:var(--ink-2); max-width:70ch; margin-top:8px; line-height:1.55;}

/* ---------- kpi ---------- */
.kpi-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px; margin-bottom:18px;}
.kpi{
  background:var(--surface); border:1px solid var(--border); border-radius:12px;
  padding:14px 15px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:6px;
}
.kpi .kpi-label{font-size:11.5px; color:var(--ink-2); font-weight:600; text-transform:uppercase; letter-spacing:0.4px; line-height:1.35;}
.kpi .kpi-value{font-family:"Fraunces",serif; font-weight:600; font-size:25px; line-height:1.1;}
.kpi .kpi-note{font-size:11px; color:var(--ink-muted);}
.kpi-chip{align-self:flex-start; font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:99px; text-transform:uppercase; letter-spacing:0.3px;}
.chip-good{background:var(--status-good-bg); color:var(--status-good);}
.chip-warning{background:var(--status-warning-bg); color:var(--status-warning);}
.chip-serious{background:var(--status-serious-bg); color:var(--status-serious);}
.chip-critical{background:var(--status-critical-bg); color:var(--status-critical);}

/* ---------- grid / card ---------- */
.grid{display:grid; gap:16px; margin-bottom:16px;}
.grid-2{grid-template-columns:repeat(auto-fit,minmax(360px,1fr));}
.card{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:18px 20px 16px; box-shadow:var(--shadow);}
.card-title{font-size:13.5px; font-weight:700; margin-bottom:2px;}
.card-sub{font-size:12px; color:var(--ink-muted); margin-bottom:14px;}

/* ---------- bar chart ---------- */
.barlist{display:flex; flex-direction:column; gap:9px;}
.barrow{display:grid; grid-template-columns:190px 1fr 54px; align-items:center; gap:10px;}
.barrow .rlabel{font-size:12.5px; color:var(--ink-2); text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.barrow .rtrack{position:relative; height:15px; background:var(--surface-2); border-radius:4px; overflow:hidden;}
.barrow .rfill{position:absolute; left:0; top:0; height:100%; border-radius:4px;}
.barrow .rval{font-size:12px; color:var(--ink); font-variant-numeric:tabular-nums; font-weight:600;}
@media (max-width:640px){ .barrow{grid-template-columns:110px 1fr 44px;} }

.legend{display:flex; flex-wrap:wrap; gap:12px; margin-top:2px;}
.legend-item{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-2);}
.legend-dot{width:9px; height:9px; border-radius:3px; flex:none;}

/* ---------- table ---------- */
details.tbl{margin-top:12px;}
details.tbl summary{cursor:pointer; font-size:12px; color:var(--ink-2); font-weight:600; list-style:none; display:flex; align-items:center; gap:5px;}
details.tbl summary::before{content:"▸"; font-size:10px; transition:transform .15s ease;}
details.tbl[open] summary::before{transform:rotate(90deg);}
details.tbl summary::-webkit-details-marker{display:none;}
.tbl-scroll{overflow-x:auto; margin-top:8px; max-height:460px; overflow-y:auto;}
table.datatable{border-collapse:collapse; width:100%; font-size:12.5px;}
table.datatable th{position:sticky; top:0; background:var(--surface); text-align:left; padding:7px 10px; color:var(--ink-muted); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.3px; border-bottom:1px solid var(--border-strong); white-space:nowrap;}
table.datatable td{padding:7px 10px; border-bottom:1px solid var(--border); font-variant-numeric:tabular-nums; white-space:nowrap;}
table.datatable tr:hover td{background:var(--surface-2);}
.badge{display:inline-block; padding:1px 8px; border-radius:99px; font-size:11px; font-weight:700;}

/* ---------- tooltip ---------- */
#tooltip{
  position:fixed; pointer-events:none; z-index:999; background:var(--ink); color:var(--surface);
  font-size:12px; padding:7px 10px; border-radius:8px; box-shadow:0 8px 22px rgba(0,0,0,0.28);
  opacity:0; transform:translate(-50%,-100%); transition:opacity .1s ease; max-width:240px; line-height:1.4;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) #tooltip{background:#143539; color:#EAFBFC;} }
:root[data-theme="dark"] #tooltip{background:#143539; color:#EAFBFC;}
#tooltip.show{opacity:1;}
#tooltip .tt-label{font-weight:700; margin-bottom:2px;}

/* ---------- pager nav ---------- */
.pagernav{
  position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
  display:flex; align-items:center; gap:10px; background:var(--chrome-bg); color:var(--chrome-ink);
  padding:8px 10px 8px 16px; border-radius:99px; box-shadow:0 10px 30px rgba(0,0,0,0.25); z-index:30;
}
.pagernav .lbl{font-size:12px; color:var(--chrome-ink-muted); white-space:nowrap;}
.pagernav button{
  appearance:none; border:none; background:var(--brand-teal); color:var(--mark-ink);
  width:32px; height:32px; border-radius:50%; font-size:15px; cursor:pointer; font-weight:700;
  display:flex; align-items:center; justify-content:center;
}
.pagernav button:disabled{opacity:0.3; cursor:default;}
.pagernav button.ghost{background:transparent; color:var(--chrome-ink); border:1px solid var(--chrome-border);}

footer.appfoot{margin-top:30px; padding-top:16px; border-top:1px solid var(--border); font-size:11.5px; color:var(--ink-muted); display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;}
</style>

/* ============================= UTIL ============================= */
const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));
const fmt1 = v => (Math.round(v*10)/10).toLocaleString();
const fmtInt = v => Math.round(v).toLocaleString();
const cssv = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

function el(tag, attrs={}, children=[]){
  const n = document.createElement(tag);
  for(const k in attrs){
    if(k==="class") n.className = attrs[k];
    else if(k==="html") n.innerHTML = attrs[k];
    else if(k.startsWith("on")) n.addEventListener(k.slice(2), attrs[k]);
    else n.setAttribute(k, attrs[k]);
  }
  (Array.isArray(children)?children:[children]).forEach(c=>{
    if(c==null) return;
    n.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  });
  return n;
}

const tip = $("#tooltip");
function showTip(evt, labelHtml, bodyHtml){
  tip.innerHTML = `<div class="tt-label">${labelHtml}</div>${bodyHtml||""}`;
  tip.classList.add("show"); moveTip(evt);
}
function moveTip(evt){ tip.style.left = evt.clientX + "px"; tip.style.top = (evt.clientY - 12) + "px"; }
function hideTip(){ tip.classList.remove("show"); }
document.addEventListener("mousemove", (e)=>{ if(tip.classList.contains("show")) moveTip(e); });

function badgeFor(pct, t){ if(pct>=t.critical) return "critical"; if(pct>=t.serious) return "serious"; if(pct>=t.warning) return "warning"; return "good"; }
function badgeHtml(level, text){ return `<span class="badge" style="background:var(--status-${level}-bg); color:var(--status-${level});">${text}</span>`; }

function kpiTile(label, value, level, note){
  return el("div",{class:"kpi"},[
    el("div",{class:"kpi-label"}, label),
    el("div",{class:"kpi-value"}, value),
    level? (()=>{ const s=document.createElement("span"); s.className=`kpi-chip chip-${level}`; s.textContent = level==="good"?"Healthy":level==="critical"?"Critical":level==="serious"?"Elevated":"Watch"; return s; })() : null,
    note? el("div",{class:"kpi-note"}, note) : null,
  ].filter(Boolean));
}

function barList(opts){
  const max = opts.max ?? Math.max(...opts.data.map(d=>d.value), 1);
  const wrap = el("div", {class:"barlist"});
  opts.data.forEach(d=>{
    const pct = Math.max(2, (d.value/max)*100);
    const color = typeof opts.color === "function" ? opts.color(d) : opts.color;
    const row = el("div", {class:"barrow"});
    row.appendChild(el("div", {class:"rlabel", title:d.label}, d.label));
    const track = el("div", {class:"rtrack"});
    track.appendChild(el("div", {class:"rfill", style:`width:${pct}%; background:${color};`}));
    row.appendChild(track);
    row.appendChild(el("div", {class:"rval"}, opts.valueFmt ? opts.valueFmt(d.value) : fmt1(d.value)));
    row.addEventListener("mousemove", e=>{ showTip(e, d.label, opts.tooltip? opts.tooltip(d): (opts.valueFmt?opts.valueFmt(d.value):d.value)); });
    row.addEventListener("mouseleave", hideTip);
    wrap.appendChild(row);
  });
  opts.container.appendChild(wrap);
}

function dataTable(container, headers, rows, summaryText, open){
  const det = el("details", {class:"tbl"});
  if(open) det.setAttribute("open","");
  det.appendChild(el("summary",{}, summaryText || "View as table"));
  const scrollWrap = el("div", {class:"tbl-scroll"});
  const table = el("table", {class:"datatable"});
  table.appendChild(el("thead", {}, el("tr", {}, headers.map(h=>el("th",{},h)))));
  table.appendChild(el("tbody", {}, rows.map(r=> el("tr",{}, r.map(c=>{
    if(c && typeof c === "object" && c.html !== undefined) return el("td",{html:c.html});
    return el("td",{}, String(c));
  })) )));
  scrollWrap.appendChild(table); det.appendChild(scrollWrap); container.appendChild(det);
}

/** Formats "N exits" (or similar headline) plus a top-reasons breakdown for hover tooltips. */
function reasonBreakdownHtml(name, headline, lookup){
  const reasons = lookup && lookup[name];
  if(!reasons || !reasons.length) return headline;
  const lines = reasons.map(r=> `${r.name.split("/")[0].trim()} — ${fmt1(r.pct)}%`).join("<br>");
  return `${headline}<br><br><b>Top exit reasons</b><br>${lines}`;
}

function buildDimensionPage(rootId, opts){

  const rows = opts.rows;

    color:cssv("--accent"), valueFmt:fmtInt,

    tooltip:d=> reasonBreakdownHtml(d.label, `${fmt1(d.value)}% involuntary · ${fmtInt(d.n)} exits`, opts.reasonLookup)});

  c5.appendChild(el("div",{class:"card-sub"}, `All ${n} ${opts.dimLabelPlural}, sorted by exit volume`));
  dataTable(c5, [opts.dimLabelCap,"Total","Share %","Voluntary","Involuntary","Involuntary %","Regrettable %","Avg. Tenure (mo)","Procedure Followed %"],
    [...rows].sort((a,b)=>b.total-a.total).map(d=>[
      d.name, d.total, fmt1(d.share_pct)+"%", d.voluntary, d.involuntary,
      {html: badgeHtml(badgeFor(d.involuntary_pct,{critical:50,serious:30,warning:15}), fmt1(d.involuntary_pct)+"%")},
      {html: badgeHtml(badgeFor(d.regrettable_pct,{critical:45,serious:28,warning:15}), fmt1(d.regrettable_pct)+"%")},
      fmt1(d.avg_tenure_months), fmt1(d.procedure_pct)+"%",
    ]),
    `View all ${n} ${opts.dimLabelPlural}`, true);
  root.appendChild(c5);
}

/* ============================= BUILD PAGES ============================= */
function buildAll(){
  const k = DATA.kpis;

  const topPosition = [...DATA.by_position].sort((a,b)=>b.total-a.total)[0];
  const worstInvolPosition = [...DATA.by_position].filter(d=>d.total>=10).sort((a,b)=>b.involuntary_pct-a.involuntary_pct)[0];
  buildDimensionPage("#page-1", {
    eyebrow:"Attrition · by Position",
    title:"Which roles are we losing people from?",
    lede:"All 14 positions represented in the Turnover dataset — Fitness Consultant and Personal Trainer alone account for 71.3% of every exit logged.",
    dimLabel:"position", dimLabelCap:"Position", dimLabelPlural:"positions",
    rows: DATA.by_position,
    reasonLookup: REASONS_BY_POSITION,
    kpis: [
      kpiTile("Total Exits", fmtInt(k.total_exits)),
      kpiTile("Positions Represented", fmtInt(k.positions_count)),
      kpiTile("Largest Share", topPosition.name, "critical", fmt1(topPosition.share_pct)+"% of all exits ("+fmtInt(topPosition.total)+")"),
      kpiTile("Highest Involuntary Rate", worstInvolPosition.name, "warning", fmt1(worstInvolPosition.involuntary_pct)+"% of "+fmtInt(worstInvolPosition.total)+" exits (n≥10)"),
    ],
  });

  const topLocation = [...DATA.by_location].sort((a,b)=>b.total-a.total)[0];
  const worstInvolLocation = [...DATA.by_location].filter(d=>d.total>=10).sort((a,b)=>b.involuntary_pct-a.involuntary_pct)[0];
  buildDimensionPage("#page-2", {
    eyebrow:"Attrition · by Location",
    title:"Where is attrition concentrated?",
    lede:`All ${k.locations_count} club locations that logged an exit — Bali is the single largest source of attrition by volume, while Depok runs the highest involuntary-exit rate among sites with meaningful volume.`,
    dimLabel:"location", dimLabelCap:"Location", dimLabelPlural:"locations",
    rows: DATA.by_location,
    kpis: [
      kpiTile("Total Exits", fmtInt(k.total_exits)),
      kpiTile("Locations Represented", fmtInt(k.locations_count)),
      kpiTile("Largest Share", topLocation.name, "critical", fmt1(topLocation.share_pct)+"% of all exits ("+fmtInt(topLocation.total)+")"),
      kpiTile("Highest Involuntary Rate", worstInvolLocation.name, "warning", fmt1(worstInvolLocation.involuntary_pct)+"% of "+fmtInt(worstInvolLocation.total)+" exits (n≥10)"),
    ],
  });

  const topReason = [...DATA.by_reason].sort((a,b)=>b.total-a.total)[0];
  const perf = DATA.by_reason.find(d=>d.name==="Performance Issue");
  const reg = DATA.by_reason.find(d=>d.name==="Regulatory Violations");
  const involDriverPct = Math.round(((perf.involuntary+reg.involuntary)/k.involuntary_total)*1000)/10;
  buildDimensionPage("#page-3", {
    eyebrow:"Attrition · by Exit Survey",
    title:"What do people say is pushing them out?",
    lede:`All ${k.reasons_count} exit-survey categories logged. "Performance Issue" and "Regulatory Violations" together explain ${fmt1(involDriverPct)}% of every involuntary exit — nearly all of it, not a training accident.`,
    dimLabel:"reason", dimLabelCap:"Exit Reason", dimLabelPlural:"reasons",
    rows: DATA.by_reason,
    kpis: [
      kpiTile("Total Exits", fmtInt(k.total_exits)),
      kpiTile("Reasons Represented", fmtInt(k.reasons_count)),
      kpiTile("Top Reason", topReason.name.split("/")[0].trim(), "critical", fmt1(topReason.share_pct)+"% of all exits ("+fmtInt(topReason.total)+")"),
      kpiTile("Involuntary Drivers", "Perf. Issue + Reg. Violations", "warning", fmt1(involDriverPct)+"% of all "+fmtInt(k.involuntary_total)+" involuntary exits"),
    ],
  });
}
buildAll();

/* ============================= PAGER ============================= */
let currentPage = 1;
const TOTAL_PAGES = 3;
function goToPage(n){
  n = Math.max(1, Math.min(TOTAL_PAGES, n));
  currentPage = n;
  $$(".page").forEach(p=> p.classList.toggle("active", p.id === "page-"+n));
  $$(".pagepill").forEach(p=> p.setAttribute("aria-current", p.dataset.page == n ? "true":"false"));
  $("#pagerLabel").textContent = `Page ${n} of ${TOTAL_PAGES}`;
  $("#prevBtn").disabled = n===1;
  $("#nextBtn").disabled = n===TOTAL_PAGES;
  window.scrollTo({top:0, behavior:"auto"});
}
$$(".pagepill").forEach(p=> p.addEventListener("click", ()=> goToPage(parseInt(p.dataset.page,10))));
$("#prevBtn").addEventListener("click", ()=> goToPage(currentPage-1));
$("#nextBtn").addEventListener("click", ()=> goToPage(currentPage+1));
document.addEventListener("keydown", (e)=>{
  if(e.key==="ArrowRight") goToPage(currentPage+1);
  if(e.key==="ArrowLeft") goToPage(currentPage-1);
});
goToPage(1);
</script>
